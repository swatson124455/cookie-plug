# The formulation project check. See site/sites/bakery/form.yaml for the field rules.
# stage replaces current_setup on the formulation sites; stage, formulation_goal,
# recipe_status, and after_formulation are read by `leadgen import-form`
# (src/leadgen/inbound.py): keep their names and option strings exact.

title: "Start a formulation project"
intro: "Five questions about your product, stage, and goal, then your contact details. No sales call unless you ask for one."
summary: "Five questions about your product, stage, and goal"
kicker: "Project check"
submit: "Send the project check"
steps:
  - "We check fit with the facility and reply within {reply_within}."
  - "If it fits, you send your recipe, product, or brief, and the facility develops a sample."
  - "You approve the sample, get a written production quote, and sign directly with the facility."

fields:
  - name: product
    label: "What do you want to make?"
    placeholder: "Lower-sugar oatmeal cookie, from a kitchen recipe"
    wide: true
  - name: stage
    label: "Where are you now?"
    type: select
    options: ["Idea or concept", "Selling from a home or shared kitchen", "Selling with a co-packer", "Established brand adding products"]
  - name: formulation_goal
    label: "What should the project do?"
    type: select
    options: ["Scale my kitchen recipe", "Match an existing product", "Improve or clean up a recipe", "Make it shelf-stable", "Develop a new product from a concept"]
  - name: timing
    label: "When you want to start"
    type: select
    options: ["Now", "Within 3 months", "3 to 6 months", "Exploring"]
  - name: volume
    label: "Expected monthly volume once in production"
    type: select
    options: ["Under 5,000 units", "5,000 to 25,000", "25,000 to 100,000", "Over 100,000", "Not sure yet"]

fit:
  title: "Help us check fit"
  intro: "About a minute. These answers tell the facility where the project starts and where it has to end up, before anyone gets on a call."
  fields:
    - name: recipe_status
      label: "Where is the recipe?"
      type: select
      options: ["Production-ready formula", "Kitchen recipe", "Product to match", "Concept only", "Want a private-label recipe"]
    - name: after_formulation
      label: "Once the recipe is approved, should the facility make it?"
      type: radio
      hint: "Formulation here leads to production: the facility develops recipes for products it then makes on its own lines, and does not take formulation-only projects."
      options: ["Yes, produce it on an open line", "Not sure yet"]
    - name: storage
      label: "How will it be stored and sold?"
      type: radio
      options: ["Shelf-stable", "Refrigerated", "Frozen", "Not sure"]
    - name: sku_count
      label: "How many products (SKUs)?"
      type: radio
      options: ["1", "2 to 3", "4 to 10", "More than 10"]
    - name: pack_format
      label: "Pack format"
      placeholder: "2 oz individually wrapped, 12 per box"
    - name: target_price
      label: "Target retail price"
      placeholder: "$5.99 a bag"
    - name: allergens
      label: "Major allergens in the recipe"
      type: checkboxes
      hint: "Plants control allergens line by line, so this is the first thing the facility checks."
      options: ["Peanuts", "Tree nuts", "Dairy", "Eggs", "Wheat", "Soy", "Sesame", "Fish or shellfish", "None"]
    - name: claims
      label: "Claims you want on the pack"
      type: checkboxes
      hint: "Each claim shapes the recipe and has to be supported for your product, so the facility confirms which ones it can support before development starts."
      options: ["Vegan", "Keto", "High-protein", "Low or no added sugar", "Gluten-free", "Allergen-free", "Plant-based", "None"]
    - name: certifications
      label: "Certifications your buyers require"
      type: checkboxes
      options: ["Organic", "Gluten-free", "Kosher", "Non-GMO", "SQF or other GFSI audit", "None yet"]
    - name: channels
      label: "Where it will sell"
      type: checkboxes
      options: ["Online or direct", "Farmers markets and events", "Wholesale (cafes, gift shops)", "Grocery chains", "Online marketplaces", "Subscription boxes"]

notes_placeholder: "The product you want matched, ingredients to avoid, a retailer or launch date"
