# Deploy: connect the repo to Netlify, set base directory "site", build command
# "python build.py", publish directory "dist". Netlify Forms picks up the
# capacity-check form automatically when form_action is empty in config.yaml.
[build]
  command = "pip install -r ../requirements.txt && python build.py"
  publish = "dist"
[build.environment]
  PYTHON_VERSION = "3.11"
