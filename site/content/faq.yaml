# The FAQ. Each answer stands alone (AI assistants quote single answers).
# Keep facility claims inside what config/facility.yaml confirms.
#   group:          section heading on /faq/
#   featured: true  also shown on the home page (keep it to about five)
#   when_confirmed: answer used only once `field` is confirmed; {value} is its value
#   sites: [...]    show the item only on these sites (omit for every site)
# {reply_within} is replaced with the promise in site/shared.yaml.

- group: "Getting started"
  q: "What does a co-packer actually do?"
  sites: [bakery, pet]
  featured: true
  a: "A co-packer, or contract manufacturer, makes your product in its facility, under your brand, to your recipe or one it develops with you. You keep the brand, the customers, and the margin; it runs the production line, the packaging, and the plant's food-safety program."

- group: "Getting started"
  q: "Do I need a recipe already?"
  sites: [bakery, pet]
  featured: true
  a: "No. Formulation is part of the turnkey service: bring a product, a kitchen recipe, or a concept, and the facility develops a production recipe and samples it until you approve it."

- group: "Getting started"
  q: "How small is too small?"
  sites: [bakery, pet]
  featured: true
  a: "If you sell only at farmers markets, it is probably early. If you have a retail listing, a wholesale channel, or a launch date you cannot meet from your current kitchen, it is the right time to talk."

- group: "Getting started"
  q: "What does it cost to ask?"
  a: "Nothing. The form and the fit conversation are free, and we never charge brands. If sampling or formulation carries a fee for your product, the facility tells you before any work starts."

- group: "Getting started"
  q: "What happens after I send the capacity check?"
  sites: [bakery, pet]
  a: "We check line fit with the facility and reply within {reply_within}. If it fits, you send your product or spec for a benchmark sample; then the facility quotes in writing and you sign directly with it."

- group: "Production"
  q: "What is the minimum order?"
  featured: true
  a: "Minimums depend on the product, the format, and the packaging, so the facility confirms the number for your product on the first call, before any sampling. A plant with open capacity has more reason to make a first run work than a plant that is full."
  when_confirmed:
    field: commercial.min_order_units
    a: "Minimum runs start at {value} units; the exact number depends on your product, format, and packaging, and the facility confirms it on the first call."

- group: "Production"
  q: "How fast can I get a sample?"
  a: "Sampling starts once the facility has your product or spec, and because its lines are not booked out, you are not waiting behind a production backlog. The facility gives you a sample date for your product when it confirms fit."
  when_confirmed:
    field: commercial.sampling_turnaround_days
    a: "The facility ships a benchmark sample about {value} days after it receives your product or spec."

- group: "Production"
  q: "How long until the first production run?"
  a: "It depends on sample approval and, most often, on packaging: printed film and cartons are frequently the longest lead time. With open lines, the production schedule is not the bottleneck."
  when_confirmed:
    field: commercial.onboarding_weeks
    a: "About {value} weeks from sample approval to the first run is typical, and printed packaging is often what sets the date."

- group: "Production"
  q: "Can I bring more than one product?"
  a: "Tell us every product you want to make. The facility confirms line fit for each one before sampling."
  when_confirmed:
    field: commercial.multiple_skus_welcome
    a: "Yes. Multiple SKUs are welcome. Tell us every product you want to make, and the facility confirms line fit for each one before sampling."

- group: "Production"
  q: "What certifications does the facility hold?"
  a: "We list only certifications we can document with a current certificate, on the capabilities page. Tell us what your buyer requires, and we confirm it with the facility, in writing, before you plan around it."

- group: "Production"
  q: "Do you do private label?"
  a: "Yes. Private label (your brand on a recipe the facility develops with you) and contract manufacturing (your recipe, made by the facility) are both available."

- group: "Production"
  q: "Can you make my product shelf-stable?"
  sites: [bakery, formulation]
  a: "It is a formulation project: the recipe, the packaging, and the label all change, and shelf life has to be tested before launch. Tell us about the product, and we confirm what the facility can do for it."

- group: "Production"
  q: "Where is the product made?"
  a: "In the United States, at the facility we represent, packed to your retailer's case and pallet specifications. You learn the location, and can see the documents, before you commit to anything."

- group: "Production"
  q: "What does production cost?"
  a: "Per-unit pricing depends on the recipe, format, packaging, and run size. After a benchmark sample, the facility quotes in writing. Ask which ingredients and packaging the unit price includes so you can compare quotes fairly."

- group: "Pet products"
  q: "Can the same facility make cookies and dog treats?"
  sites: [pet]
  a: "Yes. The facility runs human bakery lines and pet lines under one roof, which is useful for brands that sell to people and their dogs."

- group: "Pet products"
  q: "Do you handle pet-food labels?"
  sites: [pet, pet-formulation]
  a: "Labeling is part of the turnkey service, and for pet products that means the pet-food label, including the guaranteed analysis. Ask who handles state feed registrations for your product, and we tell you what the facility covers and what stays with you."

- group: "Pet products"
  q: "Can my pet treats be labeled human grade?"
  sites: [pet, pet-formulation]
  a: "Only if the product and every ingredient are stored, handled, processed, and transported to human-food standards, in a facility licensed to make human food; that is the AAFCO standard for the claim. Ask, and we confirm with the facility whether your product can qualify."

- group: "Working with us"
  q: "Who are you, and who pays you?"
  featured: true
  a: "We are a partnerships service representing a US manufacturer with open capacity. The facility pays us a share of what its customers buy; brands never pay us anything."

- group: "Working with us"
  q: "Why is the facility not named on this site?"
  a: "This site is ours, not the plant's, so it states only what the facility has confirmed for publication. Before anything is produced, you know exactly who makes your product, see its documents, and sign with it directly."

- group: "Working with us"
  q: "I already have a co-packer. Why talk to you?"
  sites: [bakery, pet]
  a: "Because one plant is a single point of failure. A common approach is to keep your primary and qualify a second source on one product, so a missed run, a failed audit, or a capacity squeeze never stops shipments."

- group: "Working with us"
  q: "What if my product is not a fit?"
  a: "We tell you plainly, usually within {reply_within}, and if we know where you should look instead, we say so. A fast no is better than a slow maybe."

- group: "Formulation"
  q: "What does a formulation project include?"
  sites: [formulation, pet-formulation]
  featured: true
  a: "A production recipe developed from your kitchen recipe, a product to match, or a concept; samples until you approve one; then the label, the packaging, and a first production run on the facility's open lines. Formulation here is the first step toward production, and the terms are confirmed with the facility in writing before any work starts."

- group: "Formulation"
  q: "Do I need a recipe to start a project?"
  sites: [formulation, pet-formulation]
  featured: true
  a: "No. Bring a kitchen recipe, a product you want matched, or only a concept. The facility's formulation team develops a production recipe with you and samples it until you approve it."

- group: "Formulation"
  q: "Can I bring a competitor's product to match?"
  sites: [formulation, pet-formulation]
  featured: true
  a: "Yes, as a benchmark, if it is a product you may lawfully use that way. The facility develops a recipe that matches its taste and texture; it does not copy another brand's name, trademarks, or packaging, and your product sells under your own brand."

- group: "Formulation"
  q: "Who owns the recipe?"
  sites: [formulation, pet-formulation]
  a: "Ownership of the recipe is set in the written agreement with the facility. We get it confirmed, in writing, before any development starts, so you know the answer before you share your recipe or approve any work."

- group: "Formulation"
  q: "Can you do formulation only, without production?"
  sites: [formulation, pet-formulation]
  a: "No. Formulation here leads to production: the facility develops a recipe for the equipment that will make it, then produces it on its own lines. If you want a formula to take to another manufacturer, we are not the right fit, and we will say so plainly."

- group: "Formulation"
  q: "What does formulation cost?"
  sites: [formulation, pet-formulation]
  a: "It depends on the project, and the facility tells you before any work starts. Ask what the price covers, including samples and revisions, so nothing arrives as a surprise. Asking us costs nothing."

- group: "Formulation"
  q: "Can you formulate a complete and balanced pet food?"
  sites: [pet-formulation]
  a: "A complete and balanced claim has to be substantiated, either by formulating to an AAFCO nutrient profile for the species and life stage or by an AAFCO feeding trial. The facility confirms how it would substantiate the claim for your food, in writing, before development starts. Treats, toppers, and mixers are labeled for intermittent or supplemental feeding instead."
