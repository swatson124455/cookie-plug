- q: "What does a co-packer actually do?"
  a: "A co-packer (contract manufacturer) makes your product in their facility, under your brand, to your recipe or one they develop with you. You keep the brand, the customers, and the margin; they run the ovens, the packaging line, and the food-safety program."
- q: "Do I need to have a recipe already?"
  a: "No. Turnkey manufacturing includes formulation: you bring a product, a prototype, or a concept, and the facility develops a production-ready recipe, then samples it back to you until it matches."
- q: "What is the minimum order?"
  a: "Minimums depend on the line and the format, and they are one of the first things we confirm on a call. Most co-packers quote minimums in units per SKU per run; a facility with open capacity can usually be flexible on a first run."
- q: "How fast can I get a sample?"
  a: "Because the lines are not booked out, sampling happens in weeks rather than after a six to twelve month waitlist. Send the product or the spec; the facility benchmarks it and ships the result with a spec sheet."
- q: "Can you make both cookies and dog treats?"
  a: "Yes. The facility runs cookie, bakery, pet-treat, and pet-food lines under one roof and one food-safety program, which is unusual and useful for brands that sell to people and their dogs."
- q: "What certifications does the facility hold?"
  a: "We list only certifications we can document. The capabilities page shows the confirmed ones; ask and we will send the certificates."
- q: "Do you do private label?"
  a: "Yes. Private label (your brand on a recipe the facility owns or develops) and contract manufacturing (your recipe, produced by the facility) are both available."
- q: "Is the product shelf-stable?"
  a: "The facility produces shelf-stable baked goods. If your product is refrigerated or frozen today, converting it to shelf-stable is a formulation project we can sample."
- q: "Where does the product ship from?"
  a: "From the facility in the United States, case-packed and palletized to your retailer's specification. Nationwide shipping."
- q: "What does it cost?"
  a: "Per-unit pricing depends on the recipe, the format, and the run size. After a sample and a spec, you get a written quote; there is no cost to ask."
- q: "I already have a co-packer. Why talk to you?"
  a: "Most brands we work with keep their primary and add a second source for 20 percent of volume so a hiccup never stops shipments. A second line that has already matched your product is cheap insurance."
- q: "How small is too small?"
  a: "If you are selling at farmers markets only, it is probably early. If you have a retail listing, a wholesale channel, or a launch date you cannot meet from your current kitchen, it is the right time."
- q: "Who is behind this site?"
  a: "A partnerships lead who refers brands to a US manufacturer with open capacity. We are paid by the facility, not by you, and we stay on every account through the first production run."
