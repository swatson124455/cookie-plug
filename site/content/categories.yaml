  who_title: "Cookie projects that start here"
  who:
    - title: "A kitchen cookie that has to scale"
      text: "Hand-scooped dough and a home oven hide a lot. On production equipment the spread, the bake, and the texture change, so the recipe is rebuilt until the cookie still tastes like yours."
    - title: "A cookie to match"
      text: "Your own cookie from another kitchen, or a style you want to compete with. The facility develops to that benchmark, and you judge the sample side by side."
