dog-treat-co-packer:
  line: pet_treat
  h1: "Dog treat co-packer and manufacturer"
  title: "Dog Treat Co-Packer and Manufacturer"
  crumb: "Dog treat co-packing"
  noun: "dog treat"
  card: "For pet-treat brands that need production, packaging, and labeling in one place."
  description: "Dog treat co-packing with open capacity: formulation, production, packaging, and labeling, with pet lines under the same roof as bakery lines."
  intro: "For dog treat brands moving from a home kitchen or a first manufacturer to steady production: a US manufacturer with open pet-treat capacity now, pet lines under the same roof as its bakery lines, and the whole job handled in one place, from formulation to shelf-ready case packs."
  who_title: "Treat brands that call us"
  who:
    - title: "Baking in a home kitchen"
      text: "Pet treats are regulated as animal feed, and growth brings registrations, labels, and a buyer asking about your facility. A manufacturer takes that weight off."
    - title: "A marketplace or retail listing"
      text: "An online pet retailer or a specialty chain says yes, and the reorder arrives faster than the first order did. Production has to be ready first."
    - title: "A food brand adding a pet line"
      text: "Cookie and snack brands extending into treats need a plant that runs both. Here, human and pet lines share a roof."
    - title: "Leaving a manufacturer"
      text: "Quality drifted, minimums rose, or the plant stopped returning calls. A second source that already matches your treat protects the business."
  handles:
    - label: "Formulation"
      text: "Your recipe scaled to production, or a new treat developed with you, sampled until you approve it."
    - label: "Production"
      text: "Your treat made on an open pet-treat line, to a written spec."
    - label: "Packaging"
      text: "Packed into your retail format."
    - label: "Labeling"
      text: "The pet-food label, including the guaranteed analysis and the ingredient statement."
    - label: "Shelf-ready case packs"
      text: "Cases and pallets built to your retailer's specifications."
  ready:
    - "A case of your treats, so the facility can benchmark the real thing."
    - "Your recipe, ingredient list, and current guaranteed analysis, if you have them."
    - "Pack size, target retail price, and case pack."
    - "Realistic monthly volume for the next twelve months."
    - "Your channels (online, pet specialty, grocery) and the states you sell in, because feed registrations are state by state."
  note: "Treat formats run on different equipment: baked biscuits, soft-baked treats, jerky, freeze-dried, and extruded treats are different lines. Name yours in the capacity check; the facility confirms line fit before anything else."
  extras:
    - title: "Private label or your own recipe"
      intro: "Both are available. Private label means the facility develops a treat with you and you sell it under your brand. Contract manufacturing means it makes your existing recipe to your written spec."
      points:
        - "Private label is often the faster start when you have a brand and customers but no finished recipe."
        - "Your own recipe keeps the product unique to you: bring the formula, your current label, and a case of treats."
        - "Either way, agree in writing who owns the formula before development starts."
      guide: private-label-vs-co-packing-dog-treats
  questions:
    - q: "Do you handle pet-food labeling?"
      a: "Labeling is part of the turnkey service, and for pet products that means the pet-food label, including the guaranteed analysis. Ask who handles state feed registrations for your product, and we tell you what the facility covers and what stays with you."
    - q: "Can my treats carry a human-grade claim?"
      a: "Only if the product and every ingredient are stored, handled, processed, and transported to human-food standards, in a facility licensed to make human food; that is the AAFCO standard for the claim. Ask, and we confirm with the facility whether your product can qualify."
    - q: "Can the same facility make my cookies and my dog treats?"
      a: "Yes. The facility runs human bakery lines and pet lines under one roof, which is useful for brands that sell to people and their dogs."
    - q: "What is the minimum run for treats?"
      a: "It depends on the format and the packaging, so the facility confirms it for your treat on the first call, before any sampling."
      when_confirmed:
        field: commercial.min_order_units
        a: "Minimum runs start at {value} units; the exact number for your treat depends on the format and packaging, and the facility confirms it on the first call."

