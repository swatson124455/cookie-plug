# complete-and-balanced promises; those are confirmed per project, in writing.

cookie-recipe-development:
  line: cookie
  h1: "Cookie recipe development, built for production"
  title: "Cookie Recipe Development for Production"
  crumb: "Cookie recipe development"
  noun: "cookie"
  card: "Scale a kitchen cookie, match one, or build one from a concept, then produce it on an open cookie line."
  description: "Cookie recipe development that ends on a production line: scale a kitchen recipe, match a benchmark, or reformulate, then produce, pack, and label it."
