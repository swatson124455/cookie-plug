    - label: "Recipe development"
      text: "Your kitchen recipe scaled to production, a benchmark matched, or a new cookie developed from your brief."
    - label: "Samples"
      text: "Sampled until you approve it, judged against your own cookie or your target."
    - label: "Label and nutrition panel"
      text: "Ingredient statement, allergen declaration, and the Nutrition Facts panel, built from the approved recipe."
    - label: "Packaging"
      text: "Packed into your retail format once the recipe is approved."
    - label: "Production"
      text: "The approved recipe made on an open cookie line, to a written spec, in shelf-ready case packs."
  ready:
    - "Your recipe, in weights if you have them, or a case of the cookie you want matched."
    - "What must change and what must not: taste, texture, size, sugar, allergens, shelf life."
    - "The claims you want on the pack, and any your buyer requires."
    - "Pack size, target retail price, and where the cookie will sell."
    - "Expected monthly volume once it is in production."
  note: "Cookie formats (drop, wire-cut, bar, sandwich, soft-baked) run on different equipment, so the recipe is developed for the line that will make it. Name your format in the project check; the facility confirms line fit before development starts."
  cta: "Start your cookie project"
  extras:
    - title: "Taking a fresh cookie shelf-stable"
      intro: "Cookies sold in coffee shops, convenience stores, gift boxes, or meal kits usually have to be shelf-stable, and often individually wrapped. Converting a fresh cookie is a formulation and packaging project, and both are part of the turnkey service. Whether your wrap format fits a line is confirmed first."
      points:
        - "Tell us the shelf life you need and where the cookie will be sold."
        - "Expect the recipe, the packaging, and the label to change together."
        - "Plan for shelf-life testing before launch; it is what proves the date on the pack."
      guide: refrigerated-to-shelf-stable
  questions:
    - q: "Will the production cookie taste like my kitchen cookie?"
      a: "That is what sampling is for. The facility develops the recipe for the line that will make it and samples it until you approve it, side by side with your own cookie. Nothing is quoted for production until you do."
    - q: "Can you make my cookie gluten-free, vegan, or lower in sugar?"
      a: "Tell us the claims you want in the project check. Less sugar or a vegan recipe is a formulation question; a gluten-free or allergen-free claim also depends on testing and line controls. We confirm in writing what the facility can support for your cookie before development starts."
    - q: "What is the minimum production run?"
      a: "It depends on the format and the packaging, so the facility confirms it for your cookie on the first call, before any development starts. We will not quote a number that does not apply to your product."
