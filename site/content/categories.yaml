pet-food-formulation:
  line: pet_food
  h1: "Pet food formulation, from concept to production"
  title: "Pet Food Formulation and Recipe Development"
  crumb: "Pet food formulation"
  noun: "pet food"
  card: "Develop a food, topper, or mixer for the line that will make it, then produce it on an open pet-food line."
  description: "Pet food formulation for brands with a recipe, a product to match, or a concept: developed for the line that makes it, then produced, packed, and labeled."
  intro: "For pet food brands whose product is not production-ready yet: a home recipe, a food or topper you want matched, or a concept. The manufacturer we represent develops it with you for its open pet-food lines, samples it until you approve it, and then produces, packs, and labels it. What your label will claim decides how the food has to be formulated, so that is settled first."
  who_title: "Pet food projects that start here"
  who:
    - title: "A topper or mixer"
      text: "Fed alongside a complete food, a topper or mixer is labeled for intermittent or supplemental feeding, which shapes both the recipe and the label."
    - title: "A complete and balanced food"
      text: "A food meant to be fed on its own has to substantiate that claim. How yours would be substantiated is settled with the facility, in writing, before development starts."
    - title: "A home recipe that has to scale"
      text: "A fresh or baked recipe customers love, made in small batches. On production equipment it is rebuilt for the line and sampled until you approve it."
    - title: "A private-label food"
      text: "A retailer, a veterinary practice, or a brand extension wants a product under its own name. The facility develops it with you, under your brand."
  handles_title: "What formulation covers"
  handles:
    - label: "Recipe development"
      text: "Your recipe taken to production, a benchmark matched, or a new food developed from your brief."
    - label: "Samples"
      text: "Sampled until you approve it, judged against your own product or your target."
    - label: "The pet-food label"
      text: "The guaranteed analysis and the ingredient statement, built from the approved recipe."
    - label: "Packaging"
      text: "Packed into your retail format once the recipe is approved."
    - label: "Production"
      text: "The approved recipe made on an open pet-food line, to a written spec, in shelf-ready case packs."
  ready:
    - "Your recipe and ingredient list, or the product you want matched."
    - "Species and life stage, and whether the food is complete and balanced or for intermittent or supplemental feeding."
    - "The format: baked, kibble, freeze-dried, or another."
    - "The claims you want on the label, pack size, and target retail price."
    - "Expected monthly volume once in production, and the states you sell in."
  note: "Pet food formats (baked, extruded kibble, freeze-dried, wet) run on very different equipment, so the recipe is developed for the line that will make it. Name yours in the project check; the facility confirms line fit before development starts."
  cta: "Start your pet food project"
  questions:
    - q: "Can the food be complete and balanced?"
      a: "A complete and balanced claim has to be substantiated, either by formulating to an AAFCO nutrient profile for the species and life stage or by an AAFCO feeding trial. The facility confirms how it would substantiate the claim for your food, in writing, before development starts."
    - q: "Who handles state feed registrations?"
      a: "Many states require pet food to be registered before it is sold there. What the facility covers and what stays with you is confirmed per product, before development starts; tell us the states you sell in."
    - q: "Is there a minimum production run?"
      a: "Yes, and it depends on the format and the packaging. The facility confirms the number for your product on the first call, before any development starts."
      when_confirmed:
        field: commercial.min_order_units
        a: "Minimum runs start at {value} units; the exact number depends on your format and packaging, and the facility confirms it on the first call."
