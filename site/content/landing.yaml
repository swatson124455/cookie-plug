  intro: "A US manufacturer with open pet-treat and pet-food capacity, under one roof with its bakery lines. Answer four questions and we confirm fit within one business day."
  points:
    - "No waitlist to get on the line"
    - "Formulation, production, packaging, and the pet-food label in one place"
    - "Multiple SKUs welcome"
    - "Free to ask; brands never pay us"

