# Landing pages for paid search, served at /lp/<slug>/. They are noindex and
# stay out of the sitemap; the form records the page path, so every lead shows
# which ad channel it came from. Point each ad group's final URL at one of these.
# Facility claims follow the same rule as everywhere: confirmed facts only.

google-bakery:
  title: "Cookie and Bakery Co-Packer With Open Capacity"
  description: "Open cookie and bakery lines now. Formulation, production, packaging, and labeling under one roof. Check capacity for your product."
  h1: "Cookie and bakery co-packing, with open lines now"
  intro: "A US manufacturer with open cookie and bakery capacity, turnkey from formulation to shelf-ready case packs. Answer four questions and we confirm fit within one business day."
  points:
    - "No waitlist to get on the line"
    - "Formulation, production, packaging, labeling, and nutrition panels in one place"
    - "Multiple SKUs welcome"
    - "Free to ask; brands never pay us"

google-pet:
  title: "Dog Treat and Pet Food Co-Packer With Open Capacity"
