# Website settings. Every customer-facing fact on the site comes from this file
# or from config/facility.yaml, and facility facts render only once confirmed.
#
#   python site/build.py                  production build into site/dist/
#   python site/build.py --draft          same pages, placeholders highlighted, noindex
#   python site/build.py --preview FILE   one-file preview of the whole site
#
# Values starting with TO_FILL are placeholders. The production build lists
# every one still here and stops, so a half-filled site cannot go live.

brand: "Open Line Co-Packing"       # working name (decision 12): check the trademark and domain before you buy
brand_short: "Open Line"
tagline: "Open co-packing capacity for cookies, baked goods, and pet treats"
domain: "TO_FILL https://yourdomain.com"   # the registered domain, https, no trailing slash

capacity:
  as_of: "2026-09"                  # re-confirm with the facility monthly and update; the build warns after 45 days
  lines: [cookie, bakery, pet_treat, pet_food]   # lines open this month; must be lines in config/facility.yaml

reply_within: "one business day"    # the promise under every form; keep it true

contact:
  name: "TO_FILL Your Name"
  title: "Partnerships"
  email: "TO_FILL you@yourdomain.com"      # use the domain mailbox, not a personal address
  phone: "TO_FILL (555) 010-0000"          # optional: set to "" to leave it off the site
  address: "TO_FILL Street, City, State ZIP"   # optional: a PO box or virtual mailbox is fine; "" to omit
  linkedin: "TO_FILL https://www.linkedin.com/in/yourname"   # optional: "" to omit

author_bio: "TO_FILL One or two sentences: who you are and why you know co-packing."   # shown on every guide

form:
  provider: "netlify"               # netlify: works on Netlify with no setup. formspree: paste the endpoint below.
  action: ""                        # Formspree endpoint URL when provider is formspree

# Optional analytics, pasted verbatim into <head>. Plausible is cookie-free and
# recommended. Script hosts in the snippet are added to the security policy
# automatically; list any other hosts the tool calls in analytics_hosts.
analytics_snippet: ""
analytics_hosts: []

# IndexNow: the build publishes /<key>.txt so Bing and other IndexNow engines accept
# change pings from `python site/build.py --indexnow` (run it after a deploy that changed content).
# The key is public by design; any 8 to 128 letters, digits, or dashes work.
indexnow_key: "ee3f17956e9b3482a5103f90939a20b0"
