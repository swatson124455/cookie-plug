# Settings every site in the family shares. Each site's own settings live in
# site/sites/<id>/site.yaml and are merged over this file (the site wins).
# Every customer-facing fact comes from these files or from config/facility.yaml,
# and facility facts render only once confirmed.
#
#   python site/build.py --site bakery                 production build into site/dist/
#   python site/build.py --site bakery --draft         same pages, placeholders highlighted, noindex
#   python site/build.py --site bakery --preview FILE  one-file preview of the whole site
#   python site/build.py --images                      share images for every site (commit them)
#
# On Netlify, each site sets OPEN_LINE_SITE to its id instead of passing --site.
# Values starting with TO_FILL are placeholders. The production build lists
# every one still here or in the site's file and stops, so a half-filled site
# cannot go live.

# The family, in order. The first site that carries a shared guide is its
# canonical home; the others link to it with rel=canonical once its domain is set.
sites: [bakery, pet, formulation, pet-formulation]

capacity:
  as_of: "2026-09"                  # re-confirm with the facility monthly and update; the build warns after 45 days
  lines: [cookie, bakery, pet_treat, pet_food]   # lines open this month; must be lines in config/facility.yaml

reply_within: "one business day"    # the promise under every form; keep it true

contact:
  name: "TO_FILL Your Name"
  title: "Partnerships"
  email: "TO_FILL you@yourdomain.com"      # use a domain mailbox, not a personal address (one per site is fine: set it in site.yaml)
  phone: "TO_FILL (555) 010-0000"          # optional: set to "" to leave it off the sites
  address: "TO_FILL Street, City, State ZIP"   # optional: a PO box or virtual mailbox is fine; "" to omit
  linkedin: "TO_FILL https://www.linkedin.com/in/yourname"   # optional: "" to omit

author_bio: "TO_FILL One or two sentences: who you are and why you know co-packing and product development."   # shown on every guide

form:
  provider: "netlify"               # netlify: works on Netlify with no setup. formspree: paste the endpoint below.
  action: ""                        # Formspree endpoint URL when provider is formspree

# Optional analytics, pasted verbatim into <head>. Plausible is cookie-free and
# recommended. Script hosts in the snippet are added to the security policy
# automatically; list any other hosts the tool calls in analytics_hosts.
analytics_snippet: ""
analytics_hosts: []
