[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-plug"
version = "0.1.0"
description = "AI-assisted lead generation engine for a co-packing referral partnership (cookies, baked goods, pet food)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pillow>=10.0"]
site = ["jinja2>=3.1", "markdown>=3.5"]

[project.scripts]
leadgen = "leadgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["leadgen"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
