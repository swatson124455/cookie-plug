# Ideal Customer Profile weights. The deterministic scorer sums the points
# for each signal that is present, then clamps to 0-100. Tune these as you
# learn which leads reply and close. Keep the total of positive weights
# near 100 so the score reads as a percentage.

category_fit:            # lead's product category vs facility lines
  cookie: 20
  bakery: 18
  pet_treat: 20
  pet_food: 16
  snack: 10              # adjacent, may extend into cookies
  other: 0

segment:                 # who the lead is
  emerging_brand: 10     # under ~$1M, outgrowing kitchen
  established_brand: 16  # $1M-$50M, wants white label / second source
  retailer_private_label: 14
  non_food_brand_extension: 8   # coffee brand, influencer, hospitality
  subscription_box: 10
  distributor_or_broker: 6
  unknown: 4

signals:                 # observed on their website or in public data
  is_shopify: 4          # DTC-native, usually growing, easy to reach
  sells_wholesale: 8     # already sells B2B, understands MOQ and specs
  in_national_retail: 12 # Whole Foods, Target, Chewy etc. => volume pain
  mentions_copacker: 10  # already outsources or says they are looking
  mentions_private_label: 8
  hiring_ops_or_production: 10   # growth trigger
  out_of_stock: 8        # capacity trigger
  product_count_20_plus: 4
  product_count_under_3: -6      # too small to matter yet
  recent_funding: 10
  recent_retail_launch: 10
  recent_recall: 8         # a recall or a co-packer closure means the current supply chain failed
  new_product_launch: 6    # a new SKU or format needs a line to run on
  has_pet_and_human_lines: 6     # facility can consolidate both under one roof

hard_disqualifiers:      # any of these sets the score to 0
  - category_other_no_signals
  - explicit_own_facility_only
